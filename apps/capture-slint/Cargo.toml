[package]
name = "capture-slint"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
description = "Slint frontend for the shared screenshot capture Core."

[dependencies]
capture-core.workspace = true
capture-platform-api.workspace = true
capture-annotation.workspace = true
capture-runtime.workspace = true
capture-render.workspace = true
capture-actions.workspace = true
capture-windows.workspace = true
capture-linux.workspace = true
slint = { version = "=1.17.1", default-features = false, features = [
    "std",
    "compat-1-2",
    "backend-winit",
    "renderer-skia",
    "renderer-software",
    "raw-window-handle-06",
] }
arboard = "3"
raw-window-handle = "0.6"

[build-dependencies]
slint-build = "=1.17.1"

[target.'cfg(any(target_os = "windows", target_os = "linux"))'.dependencies]
global-hotkey = "0.8.0"

[target.'cfg(target_os = "windows")'.dependencies]
tray-icon = { version = "0.24.2", default-features = false }

[target.'cfg(target_os = "linux")'.dependencies]
ashpd = "0.12.3"
futures-util = "0.3"
ksni = { version = "0.3.6", default-features = false, features = ["blocking", "tokio"] }
tokio = { version = "1", features = ["rt", "time"] }
